<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旭スタジオ 名刺（裏面）</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <meta name="description" content="旭スタジオ 名刺の裏面デザイン（白黒・印刷用 91×55mm）">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e9e9e7;
            color: #000;
            font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2.5rem 1rem;
            min-height: 100vh;
        }

        .screen-note {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
            font-size: 0.75rem;
            color: #6b6660;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.7;
        }

        /* ── 名刺 裏面 : 91mm × 55mm ／ 白黒のみ ── */
        .card {
            width: 91mm;
            height: 55mm;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
            padding: 5.5mm 6.5mm;
        }

        /* 外枠（favicon / heroのフレームと同じ意匠） */
        .card::before {
            content: "";
            position: absolute;
            inset: 3mm;
            border: 0.35mm solid #000;
            pointer-events: none;
        }

        .card-inner {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .name {
            text-align: center;
            font-size: 4mm;
            font-weight: 600;
            letter-spacing: 0.5em;
            text-indent: 0.5em;
            line-height: 1;
            padding-top: 0.6mm;
        }

        .map {
            display: block;
            width: 100%;
            height: auto;
        }

        .map text {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
            fill: #000;
        }

        .foot {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        .foot .addr {
            font-size: 2.5mm;
            font-weight: 300;
            letter-spacing: 0.1em;
            padding-bottom: 0.4mm;
        }

        .foot .ig {
            text-align: center;
        }

        .foot .ig svg {
            display: block;
            width: 10.5mm;
            height: 10.5mm;
        }

        .foot .ig .cap {
            font-size: 1.6mm;
            font-weight: 300;
            letter-spacing: 0.18em;
            margin-top: 0.8mm;
        }

        @media print {
            @page {
                size: 91mm 55mm;
                margin: 0;
            }

            body {
                background: #fff;
                padding: 0;
                gap: 0;
                min-height: auto;
            }

            .screen-note {
                display: none;
            }

            .card {
                box-shadow: none;
            }
        }
    </style>
</head>

    <p class="screen-note">

            <svg class="map" viewBox="0 0 480 108" role="img"
                aria-label="略図。手前の通りに川元小川町バス停、その目の前が旭スタジオ。背後に旭川。右が秋田駅方面、左が新屋方面。">

                <text x="476" y="11" font-size="7.5" letter-spacing="1" text-anchor="end">秋田駅 →</text>

                <text x="189" y="29.8" font-size="7" text-anchor="end">川元小川町</text>

                <rect x="188" y="44" width="24" height="24" fill="#000" />
                <rect x="192" y="48" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.2" />

                <!-- 旭川（2本の波線） -->

                    fill="none" stroke="#000" stroke-width="0.9" />

                <text x="63" y="95" font-size="7.5" letter-spacing="4"
