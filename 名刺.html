<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旭スタジオ 名刺（裏面）</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <meta name="description" content="旭スタジオ 名刺の裏面デザイン（白黒・印刷用 91×55mm）">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e9e9e7;
            color: #000;
            font-family: "Noto Serif JP", "Noto Serif CJK JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2.5rem 1rem;
            min-height: 100vh;
        }

        .screen-note {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
            font-size: 0.75rem;
            color: #6b6660;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.7;
        }

        /* ── 名刺 裏面 : 91mm × 55mm ／ 白黒のみ ── */
        .card {
            width: 91mm;
            height: 55mm;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
            padding: 6mm 7mm;
        }

        /* 外枠（favicon / heroのフレームと同じ意匠） */
        .card::before {
            content: "";
            position: absolute;
            inset: 3mm;
            border: 0.35mm solid #000;
            pointer-events: none;
        }

        .card-inner {
            position: relative;
            z-index: 1;
            height: 100%;
        }

        /* ── websiteのheroセクションと同じ構成・書体 ── */
        .title {
            text-align: center;
            padding-top: 0.6mm;
        }

        /* 「（これから発生する場所をさがしている）」: serif / 300 / 0.12em */
        .title-lead {
            display: block;
            font-size: 2.3mm;
            font-weight: 300;
            letter-spacing: 0.12em;
            line-height: 1.7;
            margin-bottom: 1mm;
        }

        /* 「旭スタジオ」: serif / 500 / 0.15em */
        .title-main {
            display: block;
            font-size: 4.6mm;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-indent: 0.15em;
            line-height: 1.1;
        }

        /* 縦書き: hero-vertical-text と同じ Noto Sans JP / 300 / 0.3em */
        .vertical-block {
            display: flex;
            justify-content: center;
            margin-top: 3.2mm;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif;
            font-size: 2mm;
            font-weight: 300;
            letter-spacing: 0.3em;
            line-height: 2.5;
        }

        /* コーナー要素: hero-corner と同じ serif / 0.15em の絶対配置 */
        .corner-addr {
            position: absolute;
            left: 0;
            bottom: 0;
            font-size: 2.3mm;
            font-weight: 400;
            letter-spacing: 0.15em;
        }

        .corner-ig {
            position: absolute;
            right: 0;
            bottom: 0;
            text-align: center;
        }

        .corner-ig svg {
            display: block;
            width: 9.5mm;
            height: 9.5mm;
        }

        .corner-ig .cap {
            font-size: 1.5mm;
            font-weight: 400;
            letter-spacing: 0.15em;
            margin-top: 0.7mm;
        }

        @media print {
            @page {
                size: 91mm 55mm;
                margin: 0;
            }

            body {
                background: #fff;
                padding: 0;
                gap: 0;
                min-height: auto;
            }

            .screen-note {
                display: none;
            }

            .card {
                box-shadow: none;
            }
        }
    </style>
</head>
