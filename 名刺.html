<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旭スタジオ 名刺（裏面）</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <meta name="description" content="旭スタジオ 名刺の裏面デザイン（印刷用 91×55mm）">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600;700;900&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f8f7;
            --text: #1a1714;
            --muted: #8a8590;
            --border: #d4d4d0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e9e9e7;
            color: var(--text);
            font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2.5rem 1rem;
            min-height: 100vh;
        }

        .screen-note {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
            font-size: 0.75rem;
            color: #6b6660;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.7;
        }

        /* ── 名刺 裏面 : 日本の標準名刺サイズ 91mm × 55mm ── */
        .card {
            width: 91mm;
            height: 55mm;
            background-color: var(--bg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6mm 7mm;
        }

        /* 外枠（favicon / heroのフレームと同じ意匠） */
        .card::before {
            content: "";
            position: absolute;
            inset: 3mm;
            border: 0.4mm solid var(--text);
            pointer-events: none;
        }

        .card-inner {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 上段：ロゴ・名称 */
        .brand {
            text-align: center;
            padding-top: 1mm;
        }

        .brand .logo-mark {
            width: 7mm;
            height: 7mm;
            border: 0.4mm solid var(--text);
            margin: 0 auto 2.5mm;
        }

        .brand .name {
            font-size: 5.4mm;
            font-weight: 600;
            letter-spacing: 0.5em;
            text-indent: 0.5em;
            line-height: 1;
        }

        .brand .name-en {
            font-family: "Noto Sans JP", sans-serif;
            font-size: 2mm;
            font-weight: 400;
            letter-spacing: 0.42em;
            text-indent: 0.42em;
            color: var(--muted);
            margin-top: 2mm;
        }

        .brand .tagline {
            font-size: 2.4mm;
            font-weight: 400;
            letter-spacing: 0.14em;
            color: var(--text);
            margin-top: 2.4mm;
        }

        /* 区切り線 */
        .divider {
            width: 14mm;
            height: 0;
            border-top: 0.3mm solid var(--border);
            margin: 0 auto;
        }

        /* 下段：情報 */
        .info {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
            font-size: 2.3mm;
            font-weight: 300;
            line-height: 1.55;
            color: var(--text);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .info .addr {
            margin-bottom: 1.6mm;
        }

        .info .contact {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1mm 3.5mm;
            color: #4a463f;
        }

        .info .contact .label {
            color: var(--muted);
            margin-right: 0.8mm;
        }

        @media print {
            @page {
                size: 91mm 55mm;
                margin: 0;
            }

            body {
                background: #fff;
                padding: 0;
                gap: 0;
                min-height: auto;
            }

            .screen-note {
                display: none;
            }

            .card {
                box-shadow: none;
                width: 91mm;
                height: 55mm;
            }
        }
    </style>
</head>

<body>
    <p class="screen-note">
        旭スタジオ 名刺（裏面）／ 91mm × 55mm 印刷用<br>
        ブラウザの印刷機能でPDF化できます（用紙サイズ 91×55mm・余白なし）
    </p>

    <div class="card">
        <div class="card-inner">
            <div class="brand">
                <div class="logo-mark"></div>
                <div class="name">旭スタジオ</div>
                <div class="name-en">ASAHI STUDIO</div>
                <div class="tagline">秋田市旭南のオープンスタジオ</div>
            </div>

            <div class="divider"></div>

            <div class="info">
                <div class="addr">〒010-0925　秋田県秋田市旭南三丁目十番十四号</div>
                <div class="contact">
                    <span><span class="label">web</span>asahi-studio.3from2.com</span>
                    <span><span class="label">Instagram</span>@asahi_studio_exploring</span>
                    <span><span class="label">mail</span>tsuda@3from2.com</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
