<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旭スタジオ 名刺（裏面）</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <meta name="description" content="旭スタジオ 名刺の裏面デザイン（概念図の地図入り・印刷用 91×55mm）">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600;700;900&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f8f7;
            --text: #1a1714;
            --muted: #8a8590;
            --border: #d4d4d0;
            --river: #cfdce0;
            --road: #eae8e4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e9e9e7;
            color: var(--text);
            font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2.5rem 1rem;
            min-height: 100vh;
        }

        .screen-note {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
            font-size: 0.75rem;
            color: #6b6660;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.7;
        }

        /* ── 名刺 裏面 : 日本の標準名刺サイズ 91mm × 55mm ── */
        .card {
            width: 91mm;
            height: 55mm;
            background-color: var(--bg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            padding: 5mm 6mm;
        }

        /* 外枠（favicon / heroのフレームと同じ意匠） */
        .card::before {
            content: "";
            position: absolute;
            inset: 2.6mm;
            border: 0.4mm solid var(--text);
            pointer-events: none;
        }

        .card-inner {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 上段：ロゴ・名称 */
        .brand {
            text-align: center;
        }

        .brand .name {
            font-size: 3.9mm;
            font-weight: 600;
            letter-spacing: 0.42em;
            text-indent: 0.42em;
            line-height: 1;
        }

        .brand .sub {
            font-family: "Noto Sans JP", sans-serif;
            font-size: 1.75mm;
            font-weight: 400;
            letter-spacing: 0.24em;
            text-indent: 0.24em;
            color: var(--muted);
            margin-top: 1.4mm;
        }

        /* 中段：概念図の地図 */
        .map-wrap {
            position: relative;
            margin: 0.4mm 0;
        }

        .map-wrap .map-tag {
            position: absolute;
            top: 0;
            left: 0;
            font-family: "Noto Sans JP", sans-serif;
            font-size: 1.5mm;
            letter-spacing: 0.28em;
            color: var(--muted);
        }

        .map {
            display: block;
            width: 100%;
            height: auto;
        }

        .map text {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        /* 下段：情報 */
        .info {
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
            font-size: 2.15mm;
            font-weight: 300;
            line-height: 1.5;
            color: var(--text);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .info .addr {
            margin-bottom: 1.2mm;
        }

        .info .contact {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6mm 3mm;
            color: #4a463f;
        }

        .info .contact .label {
            color: var(--muted);
            margin-right: 0.7mm;
        }

        @media print {
            @page {
                size: 91mm 55mm;
                margin: 0;
            }

            body {
                background: #fff;
                padding: 0;
                gap: 0;
                min-height: auto;
            }

            .screen-note {
                display: none;
            }

            .card {
                box-shadow: none;
                width: 91mm;
                height: 55mm;
            }
        }
    </style>
</head>

<body>
    <p class="screen-note">
        旭スタジオ 名刺（裏面）／ 91mm × 55mm 印刷用<br>
        ブラウザの印刷機能でPDF化できます（用紙サイズ 91×55mm・余白なし）
    </p>

    <div class="card">
        <div class="card-inner">
            <div class="brand">
                <div class="name">旭スタジオ</div>
                <div class="sub">ASAHI STUDIO ／ 秋田市旭南のオープンスタジオ</div>
            </div>

            <div class="map-wrap">
                <!-- 概念図（実際の位置関係に基づく略図。北＝右。正確な縮尺ではありません）
                     根拠: 新屋線バス停車順（秋田駅西口→大町→旭南二・三丁目→川元小川町→
                     川元むつみ町→秋田大橋→美術大学前→新屋）。通りは旭川西岸を南北に走り、
                     スタジオは通りと旭川の間（正面が通り・奥が旭川）、オルタナスは北隣。 -->
                <svg class="map" viewBox="0 0 480 154" role="img"
                    aria-label="旭スタジオへの概念図。手前の通りに川元小川町バス停、背後に旭川。右（北）が大町・秋田駅方面、左（南）が秋田大橋・新屋・美術大学方面。アートスペース・オルタナスは秋田駅側の隣。">
                    <!-- 方面（通りの上） -->
                    <text x="8" y="12" font-size="7.5" fill="#6b665f" letter-spacing="1">← 秋田大橋・新屋・美術大学</text>
                    <text x="472" y="12" font-size="7.5" fill="#6b665f" letter-spacing="1"
                        text-anchor="end">大町・秋田駅 →</text>

                    <!-- 通り（旭川西岸を南北に走る道・新屋線バス通り） -->
                    <rect x="0" y="18" width="480" height="18" fill="var(--road)" />
                    <line x1="0" y1="27" x2="480" y2="27" stroke="#c9c6c1"
                        stroke-width="1" stroke-dasharray="9 7" />

                    <!-- バス停（新屋方面行き・スタジオの目の前） -->
                    <circle cx="200" cy="36" r="4.6" fill="var(--bg)"
                        stroke="var(--text)" stroke-width="1.6" />
                    <circle cx="200" cy="36" r="1.6" fill="var(--text)" />
                    <line x1="200" y1="42" x2="200" y2="60" stroke="var(--text)"
                        stroke-width="1" stroke-dasharray="2.5 2.5" />
                    <text x="192" y="53" font-size="7" fill="#3f3b35"
                        text-anchor="end">川元小川町バス停（目の前）</text>

                    <!-- 旭スタジオ（現在地・通りと旭川の間） -->
                    <rect x="185" y="60" width="30" height="30" fill="var(--text)" />
                    <rect x="190" y="65" width="20" height="20" fill="none"
                        stroke="var(--bg)" stroke-width="1.4" />
                    <text x="177" y="79" font-size="9" font-weight="600" fill="var(--text)"
                        text-anchor="end">旭スタジオ</text>

                    <!-- 北隣（秋田駅側）：アートスペース オルタナス -->
                    <rect x="228" y="64" width="48" height="26" fill="none"
                        stroke="var(--muted)" stroke-width="1" />
                    <text x="252" y="76" font-size="6.4" fill="#6b665f" text-anchor="middle">アートスペース</text>
                    <text x="252" y="85" font-size="7" fill="#3f3b35" text-anchor="middle">オルタナス</text>

                    <!-- 奥（旭川側）：旭南ハイツ -->
                    <rect x="290" y="94" width="66" height="22" fill="none"
                        stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" />
                    <text x="323" y="104" font-size="6.8" fill="#3f3b35" text-anchor="middle">旭南ハイツ</text>
                    <text x="323" y="112" font-size="5.6" fill="#8a8590" text-anchor="middle">ゲストルーム</text>

                    <!-- 旭川（スタジオの奥・東側を南北に流れる） -->
                    <path d="M0,128 C120,140 200,120 300,131 C380,139 440,127 480,132 L480,154
                             L0,154 Z"
                        fill="var(--river)" />
                    <text x="80" y="147" font-size="9" fill="#7d8f94" letter-spacing="3"
                        font-style="italic" transform="rotate(-3 80 147)">旭 川</text>

                    <!-- 方位（北＝右） -->
                    <g transform="translate(438,102)">
                        <line x1="-14" y1="0" x2="4" y2="0" stroke="var(--muted)" stroke-width="1" />
                        <path d="M7,0 L2,2.6 L2,-2.6 Z" fill="var(--muted)" />
                        <text x="12" y="2.6" font-size="6.5" fill="var(--muted)">N</text>
                    </g>
                </svg>
            </div>

            <div class="info">
                <div class="addr">〒010-0925　秋田県秋田市旭南三丁目十番十四号</div>
                <div class="contact">
                    <span><span class="label">web</span>asahi-studio.3from2.com</span>
                    <span><span class="label">IG</span>@asahi_studio_exploring</span>
                    <span><span class="label">mail</span>tsuda@3from2.com</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
